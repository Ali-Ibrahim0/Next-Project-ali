<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Pro - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fc; }
        .sidebar { height: 100vh; border-left: 1px solid #e3e6f0; }
        .nav-link { color: #333; font-weight: bold; }
        .nav-link:hover { color: #007bff; }
        .card { border: none; border-radius: 10px; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .empty-message { text-align: center; color: #888; padding: 20px; }
        @media (max-width: 768px) { .sidebar { position: absolute; width: 250px; z-index: 1000; } }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance Records</a></li>
                        <li class="nav-item"><a class="nav-link" href="employees.html">Employees</a></li>
                        <li class="nav-item"><a class="nav-link active" href="reports.html">Reports</a></li>
                        <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Reports</h1>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">Attendance Statistics (Bar Chart)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="attendanceChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">Status Distribution (Pie Chart)</h6>
                            </div>
                            <div class="card-body">
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer class="text-center py-3 bg-light">© 2025 Employee Attendance Pro</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let employees = JSON.parse(localStorage.getItem('employees')) || [];
            let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];

            const dates = [...new Set(attendanceData.map(r => r.date))].slice(-7);
            const presentCounts = dates.map(d => attendanceData.filter(r => r.date === d && r.status === 'Present' && employees.find(e => e.id === r.employeeId)).length);
            const lateCounts = dates.map(d => attendanceData.filter(r => r.date === d && r.status === 'Late' && employees.find(e => e.id === r.employeeId)).length);

            new Chart(document.getElementById('attendanceChart'), {
                type: 'bar',
                data: {
                    labels: dates.length ? dates : ['No data available'],
                    datasets: [
                        { label: 'Present', data: dates.length ? presentCounts : [0], backgroundColor: '#1cc88a' },
                        { label: 'Late', data: dates.length ? lateCounts : [0], backgroundColor: '#e74a3b' }
                    ]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });

            const statusCounts = {
                Present: attendanceData.filter(r => r.status === 'Present' && employees.find(e => e.id === r.employeeId)).length,
                Late: attendanceData.filter(r => r.status === 'Late' && employees.find(e => e.id === r.employeeId)).length
            };

            new Chart(document.getElementById('statusChart'), {
                type: 'pie',
                data: {
                    labels: statusCounts.Present || statusCounts.Late ? ['Present', 'Late'] : ['No data available'],
                    datasets: [{
                        data: statusCounts.Present || statusCounts.Late ? [statusCounts.Present, statusCounts.Late] : [1],
                        backgroundColor: statusCounts.Present || statusCounts.Late ? ['#1cc88a', '#e74a3b'] : ['#ccc']
                    }]
                }
            });
        });
    </script>
</body>
</html>
