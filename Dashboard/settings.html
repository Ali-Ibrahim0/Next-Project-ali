<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Pro - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fc; }
        .sidebar { height: 100vh; border-left: 1px solid #e3e6f0; }
        .nav-link { color: #333; font-weight: bold; }
        .nav-link:hover { color: #007bff; }
        .card { border: none; border-radius: 10px; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        @media (max-width: 768px) { .sidebar { position: absolute; width: 250px; z-index: 1000; } }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance Records</a></li>
                        <li class="nav-item"><a class="nav-link" href="employees.html">Employees</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                        <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Settings</h1>
                </div>
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">General Settings</h6>
                    </div>
                    <div class="card-body">
                        <form id="settingsForm">
                            <div class="mb-3">
                                <label for="userName" class="form-label">Username (for login)</label>
                                <input type="text" class="form-control" id="userName" value="Yusuf Mabrouk">
                            </div>
                            <button type="button" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
                            <button type="button" class="btn btn-danger mt-3" id="clearDataBtn">Clear All Data</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer class="text-center py-3 bg-light">© 2025 Employee Attendance Pro</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userNameInput = document.getElementById('userName');
            userNameInput.value = localStorage.getItem('userName') || 'Yusuf Mabrouk';

            document.getElementById('saveSettingsBtn').addEventListener('click', function() {
                localStorage.setItem('userName', userNameInput.value);
                alert('Settings saved!');
            });

            document.getElementById('clearDataBtn').addEventListener('click', function() {
                if (confirm('Are you sure you want to clear all data?')) {
                    localStorage.clear();
                    alert('Data cleared! Reloading page.');
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
