<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Pro - Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fc; }
        .sidebar { height: 100vh; border-left: 1px solid #e3e6f0; }
        .nav-link { color: #333; font-weight: bold; }
        .nav-link:hover { color: #007bff; }
        .card { border: none; border-radius: 10px; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .table th, .table td { text-align: center; }
        .table tr:hover { background-color: #f0f0f0; }
        .empty-message { text-align: center; color: #888; padding: 20px; }
        @media (max-width: 768px) { .sidebar { position: absolute; width: 250px; z-index: 1000; } }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance Records</a></li>
                        <li class="nav-item"><a class="nav-link active" href="employees.html">Employees</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                        <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Employees</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <input type="text" id="searchInput" class="form-control me-2" placeholder="Search by ID or Name">
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">Add Employee</button>
                    </div>
                </div>
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Employee List</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="employeesTable" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Commitment Rate</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="modal fade" id="addEmployeeModal" tabindex="-1" aria-labelledby="addEmployeeLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEmployeeLabel">Add New Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addEmployeeForm">
                        <div class="mb-3">
                            <label for="employeeName" class="form-label">Employee Name</label>
                            <input type="text" class="form-control" id="employeeName" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveEmployeeBtn">Save</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 bg-light">© 2025 Employee Attendance Pro</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let employees = JSON.parse(localStorage.getItem('employees')) || [];
            let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];
            const tableBody = document.querySelector('#employeesTable tbody');
            const searchInput = document.getElementById('searchInput');

            function calculateCommitment(empId) {
                const uniqueDays = [...new Set(attendanceData.map(r => r.date))];
                const totalDays = uniqueDays.length || 1; // Avoid division by zero
                const presentDays = [...new Set(
                    attendanceData
                        .filter(r => r.employeeId === empId && r.status === 'Present')
                        .map(r => r.date)
                )].length;
                return Math.round((presentDays / totalDays) * 100) + '%';
            }

            function renderEmployees(filter = '') {
                tableBody.innerHTML = '';
                const filteredEmployees = employees.filter(emp => emp.id.toString().includes(filter) || emp.name.toLowerCase().includes(filter.toLowerCase()));
                if (filteredEmployees.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="empty-message">No employees found</td></tr>';
                } else {
                    filteredEmployees.forEach(emp => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${emp.id}</td>
                            <td>${emp.name}</td>
                            <td>${calculateCommitment(emp.id)}</td>
                            <td><button class="btn btn-danger btn-sm deleteBtn" data-id="${emp.id}">Delete</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            }

            renderEmployees();

            searchInput.addEventListener('input', () => renderEmployees(searchInput.value.trim()));

            document.getElementById('saveEmployeeBtn').addEventListener('click', function() {
                const name = document.getElementById('employeeName').value.trim();
                if (name) {
                    const newId = employees.length ? Math.max(...employees.map(e => e.id)) + 1 : 1;
                    employees.push({ id: newId, name });
                    localStorage.setItem('employees', JSON.stringify(employees));
                    renderEmployees();
                    bootstrap.Modal.getInstance(document.getElementById('addEmployeeModal')).hide();
                    document.getElementById('employeeName').value = '';
                } else alert('Please enter an employee name!');
            });

            tableBody.addEventListener('click', function(e) {
                if (e.target.classList.contains('deleteBtn')) {
                    const id = parseInt(e.target.dataset.id);
                    employees = employees.filter(emp => emp.id !== id);
                    attendanceData = attendanceData.filter(record => record.employeeId !== id);
                    localStorage.setItem('employees', JSON.stringify(employees));
                    localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
                    renderEmployees();
                }
            });
        });
    </script>
</body>
</html>
