<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Pro - Attendance Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fc; }
        .sidebar { height: 100vh; border-left: 1px solid #e3e6f0; }
        .nav-link { color: #333; font-weight: bold; }
        .nav-link:hover { color: #007bff; }
        .card { border: none; border-radius: 10px; transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .table th, .table td { text-align: center; }
        .table tr:hover { background-color: #f0f0f0; }
        .empty-message { text-align: center; color: #888; padding: 20px; }
        @media (max-width: 768px) { .sidebar { position: absolute; width: 250px; z-index: 1000; } }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="attendance.html">Attendance Records</a></li>
                        <li class="nav-item"><a class="nav-link" href="employees.html">Employees</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                        <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Attendance Records</h1>
                    <input type="text" id="filterInput" class="form-control w-25" placeholder="Filter by name or date">
                </div>
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">All Attendance Records</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="attendanceTable" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>Employee</th>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Location</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <footer class="text-center py-3 bg-light">© 2025 Employee Attendance Pro</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let employees = JSON.parse(localStorage.getItem('employees')) || [];
            let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];
            const tableBody = document.querySelector('#attendanceTable tbody');
            const filterInput = document.getElementById('filterInput');

            function renderData(filter = '') {
                tableBody.innerHTML = '';
                const filteredData = attendanceData.filter(record => {
                    const emp = employees.find(e => e.id === record.employeeId);
                    return emp && (emp.name.toLowerCase().includes(filter.toLowerCase()) || record.date.includes(filter));
                });
                if (filteredData.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">No attendance records</td></tr>';
                } else {
                    filteredData.forEach(record => {
                        const emp = employees.find(e => e.id === record.employeeId);
                        if (emp) {
                            const row = document.createElement('tr');
                            row.innerHTML = `<td>${emp.name}</td><td>${record.date}</td><td>${record.time}</td><td>${record.location}</td><td>${record.status}</td>`;
                            tableBody.appendChild(row);
                        }
                    });
                }
            }

            renderData();

            filterInput.addEventListener('input', () => renderData(filterInput.value.trim()));
        });
    </script>
</body>
</html>
