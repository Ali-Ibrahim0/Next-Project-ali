<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 32px 24px;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin-bottom: 8px;
        }
        .analytics {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .analytic-card {
            background: #f0f4fa;
            border-radius: 8px;
            padding: 18px 28px;
            min-width: 160px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .analytic-card h2 {
            margin: 0;
            font-size: 2rem;
            color: #2d3a4b;
        }
        .analytic-card p {
            margin: 6px 0 0 0;
            color: #5c6b7a;
            font-size: 1rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-bottom: 28px;
        }
        .actions input, .actions button {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #bfc9d1;
            outline: none;
        }
        .actions input {
            width: 180px;
        }
        .actions button {
            background: #2d8cff;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .actions button:disabled {
            background: #bfc9d1;
            cursor: not-allowed;
        }
        .actions button:hover:not(:disabled) {
            background: #1769aa;
        }
        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
        }
        .attendance-table th, .attendance-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e0e6ed;
            text-align: center;
        }
        .attendance-table th {
            background: #f0f4fa;
            color: #2d3a4b;
        }
        .status-present { color: #2ecc40; font-weight: bold; }
        .status-late { color: #ff9800; font-weight: bold; }
        .status-absent { color: #e74c3c; font-weight: bold; }
        @media (max-width: 800px) {
            .container { padding: 12px 4px; }
            .analytics { gap: 8px; }
            .analytic-card { min-width: 120px; padding: 10px 8px; }
            .actions input { width: 120px; }
            .attendance-table th, .attendance-table td { font-size: 0.95rem; padding: 6px 2px; }
        }
        @media (max-width: 600px) {
            .analytics, .actions { flex-direction: column; align-items: stretch; }
            .analytic-card { width: 100%; }
            .actions input, .actions button { width: 100%; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Attendance Dashboard</h1>
        <div class="analytics" id="analytics">
            <!-- Analytics cards will be rendered here -->
        </div>
        <div class="actions">
            <input type="text" id="employeeName" placeholder="Enter your name" />
            <button id="checkInBtn">Check In</button>
            <button id="checkOutBtn" disabled>Check Out</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="attendance-table" id="attendanceTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Check In</th>
                        <th>Status</th>
                        <th>Check Out</th>
                        <th>Work Hours</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Attendance records will be rendered here -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        // --- Data Storage ---
        let attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords') || '[]');
        let checkedInEmployee = null;

        // --- Utility Functions ---
        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleDateString();
        }
        function getStatus(checkInDate) {
            const d = new Date(checkInDate);
            const hour = d.getHours();
            const min = d.getMinutes();
            if (hour < 8) return 'Absent';
            if (hour >= 8 && hour < 9) return 'Present';
            if (hour >= 9 && hour < 10) return 'Late';
            return 'Absent';
        }
        function getStatusClass(status) {
            if (status === 'Present') return 'status-present';
            if (status === 'Late') return 'status-late';
            return 'status-absent';
        }
        function calcWorkHours(inTime, outTime) {
            if (!inTime || !outTime) return '';
            const diffMs = new Date(outTime) - new Date(inTime);
            if (diffMs < 0) return '';
            const hours = Math.floor(diffMs / 3600000);
            const mins = Math.floor((diffMs % 3600000) / 60000);
            return `${hours}h ${mins}m`;
        }
        function getLocation(callback) {
            if (!navigator.geolocation) {
                callback('Not Supported');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const { latitude, longitude } = pos.coords;
                    callback(`Lat: ${latitude.toFixed(4)}, Lng: ${longitude.toFixed(4)}`);
                },
                () => callback('Unavailable'),
                { enableHighAccuracy: true, timeout: 7000 }
            );
        }
        function saveRecords() {
            localStorage.setItem('attendanceRecords', JSON.stringify(attendanceRecords));
        }

        // --- Render Functions ---
        function renderTable() {
            const tbody = document.querySelector('#attendanceTable tbody');
            tbody.innerHTML = '';
            attendanceRecords.forEach((rec, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${rec.name}</td>
                    <td>${rec.location || ''}</td>
                    <td>${formatDate(rec.checkIn)} ${formatTime(rec.checkIn)}</td>
                    <td class="${getStatusClass(rec.status)}">${rec.status}</td>
                    <td>${rec.checkOut ? formatDate(rec.checkOut) + ' ' + formatTime(rec.checkOut) : ''}</td>
                    <td>${rec.workHours || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        function renderAnalytics() {
            const total = attendanceRecords.length;
            const present = attendanceRecords.filter(r => r.status === 'Present').length;
            const late = attendanceRecords.filter(r => r.status === 'Late').length;
            const absent = attendanceRecords.filter(r => r.status === 'Absent').length;
            const analytics = [
                { label: 'Total Employees', value: total },
                { label: 'Present', value: present },
                { label: 'Late', value: late },
                { label: 'Absent', value: absent },
                { label: 'Present %', value: total ? ((present / total) * 100).toFixed(1) + '%' : '0%' },
                { label: 'Late %', value: total ? ((late / total) * 100).toFixed(1) + '%' : '0%' },
                { label: 'Absent %', value: total ? ((absent / total) * 100).toFixed(1) + '%' : '0%' },
            ];
            const analyticsDiv = document.getElementById('analytics');
            analyticsDiv.innerHTML = '';
            analytics.forEach(a => {
                const card = document.createElement('div');
                card.className = 'analytic-card';
                card.innerHTML = `<h2>${a.value}</h2><p>${a.label}</p>`;
                analyticsDiv.appendChild(card);
            });
        }

        // --- Main Logic ---
        function resetCheckInState() {
            checkedInEmployee = null;
            document.getElementById('employeeName').value = '';
            document.getElementById('employeeName').disabled = false;
            document.getElementById('checkInBtn').disabled = false;
            document.getElementById('checkOutBtn').disabled = true;
        }
        function setCheckInState(name) {
            checkedInEmployee = name;
            document.getElementById('employeeName').value = name;
            document.getElementById('employeeName').disabled = true;
            document.getElementById('checkInBtn').disabled = true;
            document.getElementById('checkOutBtn').disabled = false;
        }
        document.getElementById('checkInBtn').onclick = function() {
            const name = document.getElementById('employeeName').value.trim();
            if (!name) {
                alert('Please enter your name.');
                return;
            }
            // Prevent double check-in
            if (attendanceRecords.some(r => r.name === name && !r.checkOut)) {
                alert('You have already checked in. Please check out first.');
                return;
            }
            getLocation(location => {
                const now = new Date();
                const status = getStatus(now);
                const record = {
                    name,
                    location,
                    checkIn: now,
                    status,
                    checkOut: null,
                    workHours: ''
                };
                attendanceRecords.push(record);
                saveRecords();
                renderTable();
                renderAnalytics();
                setCheckInState(name);
            });
        };
        document.getElementById('checkOutBtn').onclick = function() {
            const name = checkedInEmployee;
            if (!name) return;
            const idx = attendanceRecords.findIndex(r => r.name === name && !r.checkOut);
            if (idx === -1) {
                alert('No active check-in found.');
                return;
            }
            const now = new Date();
            attendanceRecords[idx].checkOut = now;
            attendanceRecords[idx].workHours = calcWorkHours(attendanceRecords[idx].checkIn, now);
            saveRecords();
            renderTable();
            renderAnalytics();
            resetCheckInState();
        };

        // --- Restore State on Load ---
        function restoreCheckInState() {
            const name = document.getElementById('employeeName').value.trim();
            const active = attendanceRecords.find(r => !r.checkOut && r.name === name);
            if (active) setCheckInState(active.name);
            // else resetCheckInState();
        }
        // --- Initial Render ---
        renderTable();
        renderAnalytics();
        resetCheckInState();

        // --- Optional: Restore check-in state if page reloads ---
        document.getElementById('employeeName').addEventListener('input', restoreCheckInState);
    </script>
</body>
</html>
